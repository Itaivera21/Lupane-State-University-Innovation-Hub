<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Developer Sign In - Innovation Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dev-container {
            background: #1a1a1a;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border: 1px solid #333;
        }

        @media (max-width: 480px) {
            .dev-container {
                padding: 30px 20px;
            }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid #ff6b6b;
        }

        .logo-area h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .logo-area p {
            color: #888;
            font-size: 14px;
        }

        .dev-badge {
            background: #ff6b6b;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 14px;
            color: #fff;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #ff6b6b;
            background: #333;
        }

        .dev-btn {
            width: 100%;
            padding: 14px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin: 10px 0;
        }

        .dev-btn:hover {
            background: #ff5252;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #666;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #ff6b6b;
        }

        hr {
            border: none;
            border-top: 1px solid #333;
            margin: 20px 0;
        }

        .flash-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .flash-success {
            background: #1e3a2e;
            color: #6bff6b;
            border: 1px solid #2a4a2a;
        }

        .flash-error {
            background: #3a1e1e;
            color: #ff6b6b;
            border: 1px solid #4a2a2a;
        }

        .dev-note {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="dev-container">
        <div class="logo-area">
            <img src="{{ url_for('static', filename='Images/LSU LOGO.png') }}" alt="LSU Logo">
            <h1>Developer Portal</h1>
            <p>Innovation Hub Core Access</p>
            <span class="dev-badge">Developers Only</span>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message flash-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('dev.signin') }}">
            <div class="form-group">
                <label>Developer Email</label>
                <input type="email" name="email" placeholder="dev@innovationhub.lsu" required>
            </div>

            <div class="form-group">
                <label>Developer Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="dev-btn">Access Developer Portal</button>

            <hr>

            <div style="text-align: center;">
                <a href="{{ url_for('index') }}" class="back-link">Back to Innovation Hub</a>
            </div>
        </form>

        <div class="dev-note">
            Restricted to core developers only
        </div>
    </div>
</body>
</html>
